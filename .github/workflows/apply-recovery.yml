name: Apply recovery scripts

on:
  push:
    branches:
      - complete-disassembly
    paths:
      - 'tools/recovery/finish_bank*.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: complete-disassembly
          fetch-depth: 0

      - name: Apply recovery scripts
        shell: bash
        run: |
          set -euo pipefail
          for script in $(find tools/recovery -maxdepth 1 -type f -name 'finish_bank*.py' | sort); do
            echo "Applying ${script}"
            python "$script" . --apply
          done

      - name: Commit recovered source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete recovered Korean map script banks"
          git push origin HEAD:complete-disassembly
