name: Apply recovery scripts

on:
  push:
    branches:
      - complete-disassembly
    paths:
      - 'tools/recovery/finish_bank*.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: complete-disassembly
          fetch-depth: 0

      - name: Normalize recovery patchers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/recovery/finish_bank56.py')
          if p.exists():
              s = p.read_text(encoding='utf-8')
              old = 'pat=re.compile(r"(?ms)^("+re.escape(label)+r":\\n)(.*?^\\tdone\\n?)")'
              new = 'pat=re.compile(r"(?ms)^("+re.escape(label)+r":[^\\n]*\\n)(.*?^\\tdone\\n?)")'
              if old in s:
                  p.write_text(s.replace(old, new), encoding='utf-8')
          PY

      - name: Apply recovery scripts
        shell: bash
        run: |
          set -euo pipefail
          for script in $(find tools/recovery -maxdepth 1 -type f -name 'finish_bank*.py' | sort); do
            echo "Applying ${script}"
            python "$script" . --apply
          done

      - name: Commit recovered source
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete recovered Korean map script banks"
          git push origin HEAD:complete-disassembly
