name: Validate disassembly structure

on:
  push:
    branches: [ complete-disassembly ]
    paths:
      - 'maps/**'
      - 'data/maps/**'
      - 'tools/recovery/**'
      - 'layout.link'
      - 'wip.asm'
      - '.github/workflows/validate-disassembly.yml'

permissions:
  contents: write

env:
  rgbds_version: v1.0.3

jobs:
  gold-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Ensure LFS assets are materialized
        run: git lfs pull

      - name: Checkout rgbds
        uses: actions/checkout@v4
        with:
          repository: gbdev/rgbds
          ref: ${{ env.rgbds_version }}
          path: rgbds

      - name: Install rgbds
        working-directory: rgbds
        run: |
          sudo apt-get update
          sudo apt-get install -yq bison libpng-dev pkg-config
          sudo make -j$(nproc) install

      - name: Remove rgbds source
        run: rm -rf rgbds

      - name: Create dummy baseroms
        run: |
          truncate -s 2097152 baserom_g.bin
          truncate -s 2097152 baserom_s.bin

      - name: Stage Map Scripts 23 for structure test
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('data/maps/scripts.asm')
          s = p.read_text()
          needle = '/*\nSECTION "Map Scripts 23", ROMX'
          if needle in s:
              s = s.replace(needle, 'SECTION "Map Scripts 23", ROMX', 1)
              marker = '\n\nSECTION "Map Scripts 24", ROMX'
              if marker not in s:
                  raise SystemExit('Map Scripts 24 marker not found')
              s = s.replace(marker, '\n\n/*\nSECTION "Map Scripts 24", ROMX', 1)
              p.write_text(s)

          p = Path('layout.link')
          s = p.read_text()
          old = '; ROMX $59\n; \t"Map Scripts 23"'
          if old in s:
              s = s.replace(old, 'ROMX $59\n\t"Map Scripts 23"', 1)
              p.write_text(s)
          PY

      - name: Build Gold structure
        shell: bash
        run: |
          set +e
          make gold -j$(nproc) > build.log 2>&1
          status=$?
          echo '--- first/last relevant build errors ---'
          grep -inE 'error|fatal|rgbasm|rgblink|make: \*\*\*|assert|overflow|overlap' build.log | tail -n 100 || true
          echo '--- build tail ---'
          tail -n 120 build.log || true
          exit "$status"

      - name: Commit validated Map Scripts 23 activation
        shell: bash
        run: |
          if git diff --quiet -- data/maps/scripts.asm layout.link; then
            echo 'Map Scripts 23 is already committed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/maps/scripts.asm layout.link
          git commit -m 'maps: activate Map Scripts 23'
          git push origin HEAD:complete-disassembly

      - name: Show recovered map-script placement
        if: always()
        shell: bash
        run: |
          if [ -f pokegold.map ]; then
            grep -A8 -B2 'Map Scripts 19\|Map Scripts 20\|Map Scripts 21\|Map Scripts 22\|Map Scripts 23' pokegold.map || true
          fi
